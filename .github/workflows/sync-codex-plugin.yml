name: Sync Codex Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-codex-plugin

jobs:
  open-pr:
    runs-on: ubuntu-latest
    # PR の作成は GitHub App のトークンで行うため、GITHUB_TOKEN の権限は使わない
    permissions: {}
    steps:
      # GITHUB_TOKEN で作った PR では pull_request のワークフロー（check-codex-plugin など）が起動しないため、
      # GitHub App（Pull requests: write / Contents: read）のトークンを使う
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CREATE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.CREATE_PR_APP_PRIVATE_KEY }}

      - name: Open PR from main to codex-plugin
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 既に開いている PR は main への push で自動的に更新されるため、作り直さない
          existing=$(gh pr list --base codex-plugin --head main --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "PR already exists: $existing"
            exit 0
          fi

          ahead=$(gh api "repos/${GH_REPO}/compare/codex-plugin...main" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "codex-plugin already contains main — skipping."
            exit 0
          fi

          gh pr create \
            --base codex-plugin \
            --head main \
            --title "main の変更を codex-plugin に取り込む" \
            --body "$(cat <<'EOF'
          main への push を受けて自動作成した PR です。

          - `skills/`, `agents/`, `scripts/`, `codex/`, `.codex-plugin/`, `.agents/plugins/` に変更がある場合は、`.codex-plugin/plugin.json` の `version` を上げてください
          - 共通手順の変更が入口と `codex/compatibility.md` で読み替えられるか確認してください
          EOF
          )"
