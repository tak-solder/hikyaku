name: Check Scripts

on:
  pull_request:
    branches:
      - main
      - codex-plugin
    paths:
      - "scripts/**"
      - "tests/**"
      # conductor lint がスキルのタグを読むため
      - "skills/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/check-scripts.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          # 型剥がしがフラグ無しで有効になる最小バージョン
          node-version: "22.18.0"
          cache: npm

      - run: npm ci

      # erasableSyntaxOnly により、型剥がしで動かない構文もここで検出される
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and CLI integration tests
        run: npm test

      - name: Smoke test (CLI が起動するか)
        run: |
          node scripts/hikyaku.mts version
          node scripts/hikyaku.mts help > /dev/null
          node scripts/hikyaku.mts doctor --json > /dev/null || true

      # 組み込みの BP 既定値が、組み込みの期待値ケースを壊していないか。
      # ワークスペースの bp-guide/ はこの検証の対象外（利用者側の validate が見る）
      - name: BP built-in cases
        run: node scripts/hikyaku.mts bp test --builtin

      # スキルに付けた問いの ID（（G8）/（ask: branch））と、conductor の ID の表の突き合わせ
      - name: Conductor ask tags
        run: node scripts/hikyaku.mts conductor lint

  # 一時的な計測用ジョブ（PR #92 の調査用。マージ前に削除する）
  measure:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-slim, ubuntu-latest]
        tmp: [default, shm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci
      - name: Environment
        run: |
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          df -hT /tmp /dev/shm . || true
          mount | grep -E " on (/|/tmp|/dev/shm|/home/runner) " || true
      - name: npm test (measured)
        run: |
          if [ "${{ matrix.tmp }}" = shm ]; then export TMPDIR=/dev/shm; fi
          echo "TMPDIR=${TMPDIR:-/tmp}"
          # /proc/stat の cpu 行: user nice system idle iowait irq softirq steal
          before=$(head -1 /proc/stat)
          time npm test > test.log 2>&1
          after=$(head -1 /proc/stat)
          tail -n 3 test.log
          node -e '
            const [b, a] = process.argv.slice(1).map(l => l.trim().split(/\s+/).slice(1).map(Number));
            const d = a.map((v, i) => v - b[i]);
            const names = ["user","nice","system","idle","iowait","irq","softirq","steal"];
            const total = d.slice(0, 8).reduce((s, v) => s + v, 0);
            for (let i = 0; i < 8; i++) console.log(names[i].padEnd(8), (100 * d[i] / total).toFixed(1) + "%");
          ' "$before" "$after"
