name: Check Skill Versions

on:
  pull_request:
    branches:
      - main
      - "beta/*"

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: current

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check plugin version format
        run: |
          version=$(jq -r '.version' current/.claude-plugin/plugin.json)
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid Claude Code plugin version: $version"
            exit 1
          fi
          echo "Claude Code plugin version: $version"

      - name: Check version bump if skills, agents, scripts, or plugin manifest changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # beta/* はリリース前の次のメジャーを積む場所で、版はそのメジャーの x.0.0 に固定する。
          # PR ごとに上げると、リリースまでの版が意味を持たずに進むため。
          if [[ "$BASE_REF" == beta/* ]]; then
            current=$(jq -r '.version' current/.claude-plugin/plugin.json)
            expected="${BASE_REF#beta/v}.0.0"
            if [ "$current" != "$expected" ]; then
              echo "::error::beta/* 向けの PR では version を $expected に固定してください（現在: $current）"
              exit 1
            fi
            echo "beta branch: version is fixed at $expected"
            exit 0
          fi

          # Check if current/skills/, current/agents/, current/scripts/, current/hooks/, or .claude-plugin/ has changes compared to base.
          # For agents/: treat one-sided absence (initial add or full directory removal) as "changed",
          # since `diff -rq` errors out (and `2>/dev/null` discards it) when one side is missing.
          if [ -d current/agents ] && [ -d base/agents ]; then
            agents_changed=$(diff -rq current/agents/ base/agents/ 2>/dev/null || true)
          elif [ -d current/agents ] || [ -d base/agents ]; then
            agents_changed="agents/ directory presence changed between base and current"
          else
            agents_changed=""
          fi
          changed=$(diff -rq current/skills/ base/skills/ 2>/dev/null || true)
          plugin_changed=$(diff -rq current/.claude-plugin/ base/.claude-plugin/ 2>/dev/null || true)
          if [ -d current/scripts ] && [ -d base/scripts ]; then
            scripts_changed=$(diff -rq current/scripts/ base/scripts/ 2>/dev/null || true)
          elif [ -d current/scripts ] || [ -d base/scripts ]; then
            scripts_changed="scripts/ directory presence changed between base and current"
          else
            scripts_changed=""
          fi
          if [ -d current/hooks ] && [ -d base/hooks ]; then
            hooks_changed=$(diff -rq current/hooks/ base/hooks/ 2>/dev/null || true)
          elif [ -d current/hooks ] || [ -d base/hooks ]; then
            hooks_changed="hooks/ directory presence changed between base and current"
          else
            hooks_changed=""
          fi
          if [ -z "$changed" ] && [ -z "$agents_changed" ] && [ -z "$plugin_changed" ] && [ -z "$scripts_changed" ] && [ -z "$hooks_changed" ]; then
            echo "No changes in skills/, agents/, scripts/, hooks/, or .claude-plugin/ — skipping version bump check."
            exit 0
          fi

          if [ -n "$changed" ]; then
            echo "Changed files in skills/:"
            echo "$changed"
          fi
          if [ -n "$agents_changed" ]; then
            echo "Changed files in agents/:"
            echo "$agents_changed"
          fi
          if [ -n "$plugin_changed" ]; then
            echo "Changed files in .claude-plugin/:"
            echo "$plugin_changed"
          fi
          if [ -n "$scripts_changed" ]; then
            echo "Changed files in scripts/:"
            echo "$scripts_changed"
          fi
          if [ -n "$hooks_changed" ]; then
            echo "Changed files in hooks/:"
            echo "$hooks_changed"
          fi

          # Extract current version from plugin.json (single source of truth)
          current=$(jq -r '.version' current/.claude-plugin/plugin.json)
          base=$(jq -r '.version' base/.claude-plugin/plugin.json)

          echo "Base version: $base"
          echo "Current version: $current"

          if [ "$current" = "$base" ]; then
            echo "::error::skills/, agents/, scripts/, hooks/, or .claude-plugin/ has changes but version was not bumped. Please update the version in .claude-plugin/plugin.json."
            exit 1
          fi

          # Verify semver is actually higher
          IFS='.' read -r cur_major cur_minor cur_patch <<< "$current"
          IFS='.' read -r base_major base_minor base_patch <<< "$base"

          is_higher=false
          if [ "$cur_major" -gt "$base_major" ]; then
            is_higher=true
          elif [ "$cur_major" -eq "$base_major" ] && [ "$cur_minor" -gt "$base_minor" ]; then
            is_higher=true
          elif [ "$cur_major" -eq "$base_major" ] && [ "$cur_minor" -eq "$base_minor" ] && [ "$cur_patch" -gt "$base_patch" ]; then
            is_higher=true
          fi

          if [ "$is_higher" = false ]; then
            echo "::error::Version $current is not higher than base version $base. Please bump the version following semver."
            exit 1
          fi

          echo "Version correctly bumped: $base -> $current"
