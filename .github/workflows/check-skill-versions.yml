name: Check Skill Versions

on:
  pull_request:
    branches:
      - main

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: current

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check skill and plugin versions are unified
        run: |
          versions=()
          for skill_file in current/skills/*/SKILL.md; do
            version=$(yq --front-matter=extract '.metadata.version' "$skill_file")
            skill_name=$(basename "$(dirname "$skill_file")")
            echo "$skill_name: $version"
            versions+=("$version")
          done

          plugin_version=$(jq -r '.version' current/.claude-plugin/plugin.json)
          echo "plugin.json: $plugin_version"
          versions+=("$plugin_version")

          first="${versions[0]}"
          for v in "${versions[@]}"; do
            if [ "$v" != "$first" ]; then
              echo "::error::Skill versions and plugin.json version are not unified. All must have the same version."
              exit 1
            fi
          done
          echo "All versions are unified: $first"

      - name: Check version bump if skills, agents, or plugin manifest changed
        run: |
          # Check if current/skills/, current/agents/, or .claude-plugin/ has changes compared to base.
          # For agents/: treat one-sided absence (initial add or full directory removal) as "changed",
          # since `diff -rq` errors out (and `2>/dev/null` discards it) when one side is missing.
          if [ -d current/agents ] && [ -d base/agents ]; then
            agents_changed=$(diff -rq current/agents/ base/agents/ 2>/dev/null || true)
          elif [ -d current/agents ] || [ -d base/agents ]; then
            agents_changed="agents/ directory presence changed between base and current"
          else
            agents_changed=""
          fi
          changed=$(diff -rq current/skills/ base/skills/ 2>/dev/null || true)
          plugin_changed=$(diff -rq current/.claude-plugin/ base/.claude-plugin/ 2>/dev/null || true)
          if [ -z "$changed" ] && [ -z "$agents_changed" ] && [ -z "$plugin_changed" ]; then
            echo "No changes in skills/, agents/, or .claude-plugin/ — skipping version bump check."
            exit 0
          fi

          if [ -n "$changed" ]; then
            echo "Changed files in skills/:"
            echo "$changed"
          fi
          if [ -n "$agents_changed" ]; then
            echo "Changed files in agents/:"
            echo "$agents_changed"
          fi
          if [ -n "$plugin_changed" ]; then
            echo "Changed files in .claude-plugin/:"
            echo "$plugin_changed"
          fi

          # Extract current version from plugin.json (single source of truth, already verified unified)
          current=$(jq -r '.version' current/.claude-plugin/plugin.json)
          base=$(jq -r '.version' base/.claude-plugin/plugin.json)

          echo "Base version: $base"
          echo "Current version: $current"

          if [ "$current" = "$base" ]; then
            echo "::error::skills/, agents/, or .claude-plugin/ has changes but version was not bumped. Please update the version in all SKILL.md files and plugin.json."
            exit 1
          fi

          # Verify semver is actually higher
          IFS='.' read -r cur_major cur_minor cur_patch <<< "$current"
          IFS='.' read -r base_major base_minor base_patch <<< "$base"

          is_higher=false
          if [ "$cur_major" -gt "$base_major" ]; then
            is_higher=true
          elif [ "$cur_major" -eq "$base_major" ] && [ "$cur_minor" -gt "$base_minor" ]; then
            is_higher=true
          elif [ "$cur_major" -eq "$base_major" ] && [ "$cur_minor" -eq "$base_minor" ] && [ "$cur_patch" -gt "$base_patch" ]; then
            is_higher=true
          fi

          if [ "$is_higher" = false ]; then
            echo "::error::Version $current is not higher than base version $base. Please bump the version following semver."
            exit 1
          fi

          echo "Version correctly bumped: $base -> $current"
