name: Check Skill Versions

on:
  pull_request:
    branches:
      - main

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: current

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check plugin version format
        run: |
          version=$(jq -r '.version' current/.claude-plugin/plugin.json)
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid Claude Code plugin version: $version"
            exit 1
          fi
          echo "Claude Code plugin version: $version"

      - name: Check version bump if skills, agents, scripts, or plugin manifest changed
        run: |
          # Check if current/skills/, current/agents/, current/scripts/, or .claude-plugin/ has changes compared to base.
          # For agents/: treat one-sided absence (initial add or full directory removal) as "changed",
          # since `diff -rq` errors out (and `2>/dev/null` discards it) when one side is missing.
          if [ -d current/agents ] && [ -d base/agents ]; then
            agents_changed=$(diff -rq current/agents/ base/agents/ 2>/dev/null || true)
          elif [ -d current/agents ] || [ -d base/agents ]; then
            agents_changed="agents/ directory presence changed between base and current"
          else
            agents_changed=""
          fi
          changed=$(diff -rq current/skills/ base/skills/ 2>/dev/null || true)
          plugin_changed=$(diff -rq current/.claude-plugin/ base/.claude-plugin/ 2>/dev/null || true)
          if [ -d current/scripts ] && [ -d base/scripts ]; then
            scripts_changed=$(diff -rq current/scripts/ base/scripts/ 2>/dev/null || true)
          elif [ -d current/scripts ] || [ -d base/scripts ]; then
            scripts_changed="scripts/ directory presence changed between base and current"
          else
            scripts_changed=""
          fi
          if [ -z "$changed" ] && [ -z "$agents_changed" ] && [ -z "$plugin_changed" ] && [ -z "$scripts_changed" ]; then
            echo "No changes in skills/, agents/, scripts/, or .claude-plugin/ — skipping version bump check."
            exit 0
          fi

          if [ -n "$changed" ]; then
            echo "Changed files in skills/:"
            echo "$changed"
          fi
          if [ -n "$agents_changed" ]; then
            echo "Changed files in agents/:"
            echo "$agents_changed"
          fi
          if [ -n "$plugin_changed" ]; then
            echo "Changed files in .claude-plugin/:"
            echo "$plugin_changed"
          fi
          if [ -n "$scripts_changed" ]; then
            echo "Changed files in scripts/:"
            echo "$scripts_changed"
          fi

          # Extract current version from plugin.json (single source of truth)
          current=$(jq -r '.version' current/.claude-plugin/plugin.json)
          base=$(jq -r '.version' base/.claude-plugin/plugin.json)

          echo "Base version: $base"
          echo "Current version: $current"

          if [ "$current" = "$base" ]; then
            echo "::error::skills/, agents/, scripts/, or .claude-plugin/ has changes but version was not bumped. Please update the version in .claude-plugin/plugin.json."
            exit 1
          fi

          # Verify semver is actually higher
          IFS='.' read -r cur_major cur_minor cur_patch <<< "$current"
          IFS='.' read -r base_major base_minor base_patch <<< "$base"

          is_higher=false
          if [ "$cur_major" -gt "$base_major" ]; then
            is_higher=true
          elif [ "$cur_major" -eq "$base_major" ] && [ "$cur_minor" -gt "$base_minor" ]; then
            is_higher=true
          elif [ "$cur_major" -eq "$base_major" ] && [ "$cur_minor" -eq "$base_minor" ] && [ "$cur_patch" -gt "$base_patch" ]; then
            is_higher=true
          fi

          if [ "$is_higher" = false ]; then
            echo "::error::Version $current is not higher than base version $base. Please bump the version following semver."
            exit 1
          fi

          echo "Version correctly bumped: $base -> $current"

      - name: Check Codex versions and skill references
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import { resolve, dirname } from 'node:path';

          const read = path => readFileSync(path, 'utf8');
          const manifest = JSON.parse(read('current/.codex-plugin/plugin.json'));
          const version = manifest.version;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          assert.match(version, semver);
          assert.equal(manifest.skills, './codex/skills/');
          const skills = readdirSync('current/codex/skills', { withFileTypes: true })
            .filter(entry => entry.isDirectory()).map(entry => entry.name);
          assert.ok(skills.length > 0, 'Codex skills must not be empty');
          for (const name of skills) {
            const path = `current/codex/skills/${name}/SKILL.md`;
            const source = read(path);
            const frontmatter = source.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/)?.[1];
            assert.ok(frontmatter, `${path}: missing frontmatter`);
            assert.equal(frontmatter.match(/^name: (.+)$/m)?.[1], name, `${path}: name`);
            const required = ['../../compatibility.md', `../../../skills/${name}/SKILL.md`];
            const links = [...source.matchAll(/\]\(([^)]+)\)/g)].map(match => match[1]);
            for (const target of required) assert.ok(links.includes(target), `${path}: missing ${target}`);
            for (const target of links.filter(link => link.startsWith('.'))) {
              assert.ok(existsSync(resolve(dirname(path), target)), `${path}: broken link ${target}`);
            }
          }

          // Codex のバージョンは Claude Code とは独立して検証する。初回追加には比較対象がない。
          if (existsSync('base/.codex-plugin/plugin.json')) {
            const snapshot = directory => {
              if (!existsSync(directory)) return null;
              return readdirSync(directory, { withFileTypes: true })
                .sort((a, b) => a.name.localeCompare(b.name))
                .map(entry => [entry.name, entry.isDirectory()
                  ? snapshot(`${directory}/${entry.name}`) : read(`${directory}/${entry.name}`)]);
            };
            const changed = ['codex', '.codex-plugin', '.agents/plugins'].some(directory =>
              JSON.stringify(snapshot(`current/${directory}`)) !== JSON.stringify(snapshot(`base/${directory}`)));
            if (changed) {
              const previous = JSON.parse(read('base/.codex-plugin/plugin.json')).version;
              assert.match(previous, semver);
              const a = version.split('.').map(BigInt);
              const b = previous.split('.').map(BigInt);
              const index = a.findIndex((part, i) => part !== b[i]);
              assert.ok(index >= 0 && a[index] > b[index], `Codex version must increase: ${previous} -> ${version}`);
            }
          }
          console.log(`Codex ${version}: ${skills.length} skills and references verified`);
          NODE
